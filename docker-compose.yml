services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modbot
      POSTGRES_PASSWORD: modbot
      POSTGRES_DB: modbot
    ports:
      - "5432:5432"
    volumes:
      - modbot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modbot"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://modbot:modbot@db:5432/modbot
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  modbot_pg:
